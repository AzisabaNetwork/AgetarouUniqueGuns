name: AgetarouUniqueGuns
version: ${project.version}
main: com.github.aburaagetarou.agetarouuniqueguns.AgetarouUniqueGuns
api-version: '1.21.11'
depend:
  - CrackShot
  - CrackShotPlus
  - LeonGunWar
  - ProtocolLib
permissions:
  agetarouuniqueguns.help:
    description: AgetarouUniqueGuns help
    default: op
  agetarouuniqueguns.reload:
    description: AgetarouUniqueGuns config reload
    default: op
  agetarouuniqueguns.setvariable:
